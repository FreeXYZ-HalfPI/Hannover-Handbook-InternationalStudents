<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="210" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#065f46">Reporting with an Issue — five steps</text>
  <rect x="20" y="60" width="132" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="86" y="92" text-anchor="middle" font-weight="700" fill="#065f46">1</text>
  <text x="86" y="116" text-anchor="middle" fill="#111827">Sign in</text>
  <text x="86" y="136" text-anchor="middle" fill="#475569" font-size="12">github.com</text>
  <path d="M155 105 L175 105" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="168" y="60" width="132" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="234" y="92" text-anchor="middle" font-weight="700" fill="#065f46">2</text>
  <text x="234" y="116" text-anchor="middle" fill="#111827">Issues tab</text>
  <text x="234" y="136" text-anchor="middle" fill="#475569" font-size="12">New issue</text>
  <path d="M303 105 L323 105" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="316" y="60" width="132" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="382" y="92" text-anchor="middle" font-weight="700" fill="#065f46">3</text>
  <text x="382" y="116" text-anchor="middle" fill="#111827">Pick a template</text>
  <text x="382" y="136" text-anchor="middle" fill="#475569" font-size="12">Get started</text>
  <path d="M451 105 L471 105" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="464" y="60" width="132" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="530" y="92" text-anchor="middle" font-weight="700" fill="#065f46">4</text>
  <text x="530" y="116" text-anchor="middle" fill="#111827">Describe it</text>
  <text x="530" y="136" text-anchor="middle" fill="#475569" font-size="12">page + source</text>
  <path d="M599 105 L619 105" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="612" y="60" width="132" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="678" y="92" text-anchor="middle" font-weight="700" fill="#065f46">5</text>
  <text x="678" y="116" text-anchor="middle" fill="#111827">Send</text>
  <text x="678" y="136" text-anchor="middle" fill="#475569" font-size="12">Submit new issue</text>
  <text x="380" y="188" text-anchor="middle" fill="#475569" font-size="13">No Git knowledge needed — just a free GitHub account</text>
</svg>
