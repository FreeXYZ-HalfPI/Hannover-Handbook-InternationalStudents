<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">Editing in your browser — Pull Request</text>
  <rect x="30" y="55" width="210" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="135" y="84" text-anchor="middle" font-weight="700" fill="#1e40af">1. Open the page</text>
  <text x="135" y="110" text-anchor="middle" fill="#475569" font-size="12">e.g. handbook/…/10-residence-permit.md</text>
  <path d="M240 95 L273 95" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="275" y="55" width="210" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="380" y="84" text-anchor="middle" font-weight="700" fill="#1e40af">2. Click the pencil ✏️</text>
  <text x="380" y="110" text-anchor="middle" fill="#475569" font-size="12">Edit this file → Fork</text>
  <path d="M485 95 L518 95" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="520" y="55" width="210" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="625" y="84" text-anchor="middle" font-weight="700" fill="#1e40af">3. Edit the text</text>
  <text x="625" y="110" text-anchor="middle" fill="#475569" font-size="12">official source + access date</text>
  <path d="M625 135 L625 172" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="520" y="175" width="210" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="625" y="204" text-anchor="middle" font-weight="700" fill="#1e40af">4. Save the change</text>
  <text x="625" y="230" text-anchor="middle" fill="#475569" font-size="12">Commit changes → Propose changes</text>
  <path d="M520 215 L487 215" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="275" y="175" width="210" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="380" y="204" text-anchor="middle" font-weight="700" fill="#1e40af">5. Ask to merge</text>
  <text x="380" y="230" text-anchor="middle" fill="#475569" font-size="12">Create pull request</text>
  <path d="M275 215 L242 215" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="30" y="175" width="210" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="135" y="204" text-anchor="middle" font-weight="700" fill="#065f46">6. Review and merge</text>
  <text x="135" y="230" text-anchor="middle" fill="#475569" font-size="12">maintainers → Merge</text>
  <text x="380" y="300" text-anchor="middle" fill="#111827">In step 2 GitHub makes your own copy (fork) of the repository;</text>
  <text x="380" y="325" text-anchor="middle" fill="#111827">the handbook only changes once a maintainer approves.</text>
</svg>
