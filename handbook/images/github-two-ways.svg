<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Noto Sans', 'DejaVu Sans', Arial, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">Two ways to help improve the handbook</text>
  <rect x="270" y="52" width="220" height="50" rx="10" fill="#eef2ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="380" y="83" text-anchor="middle" fill="#111827">You found a mistake or a gap</text>
  <path d="M330 102 L180 140" stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <rect x="40" y="142" width="280" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="180" y="168" text-anchor="middle" font-weight="700" fill="#065f46">Easy way: open an Issue</text>
  <text x="180" y="192" text-anchor="middle" fill="#111827">Just describe the problem (5 minutes)</text>
  <path d="M180 206 L180 240" stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <rect x="40" y="242" width="280" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="180" y="268" text-anchor="middle" fill="#111827">The maintainers check it</text>
  <text x="180" y="292" text-anchor="middle" fill="#111827">and fix the page</text>
  <path d="M430 102 L580 140" stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <rect x="440" y="142" width="280" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="580" y="168" text-anchor="middle" font-weight="700" fill="#1e40af">Direct way: Pull Request</text>
  <text x="580" y="192" text-anchor="middle" fill="#111827">Edit the text yourself</text>
  <path d="M580 206 L580 240" stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none"/>
  <rect x="440" y="242" width="280" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="580" y="268" text-anchor="middle" fill="#111827">The maintainers review</text>
  <text x="580" y="292" text-anchor="middle" fill="#111827">and merge your change</text>
</svg>
