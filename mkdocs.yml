# SPDX-License-Identifier: GPL-3.0-or-later
# Copyleft 🄯 2026 ISL and contributors
# Website for the handbook: https://freexyz-halfpi.github.io/Hannover-Handbook-InternationalStudents/
# Build locally:  pip install -r requirements-site.txt && mkdocs serve
# The pages in handbook/ stay plain GitHub Markdown; tools/mkdocs_hooks.py adapts
# them for the site (GitHub alerts, links outside handbook/, section titles).

site_name: Living in Hannover — A Practical Handbook
site_description: A practical, step-by-step handbook for international students at Leibniz University Hannover — ISL
site_author: Iranian Student Association of Leibniz University Hannover (ISL)
site_url: https://freexyz-halfpi.github.io/Hannover-Handbook-InternationalStudents/
repo_url: https://github.com/FreeXYZ-HalfPI/Hannover-Handbook-InternationalStudents
repo_name: Hannover-Handbook-InternationalStudents
edit_uri: edit/main/handbook/
copyright: Copyleft 🄯 2026 ISL and contributors — GNU GPL v3 or later

docs_dir: handbook
site_dir: site

theme:
  name: material
  language: en
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.action.edit

hooks:
  - tools/mkdocs_hooks.py

extra_css:
  - assets/site.css

extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/hannover_iranian_students
      name: ISL Telegram channel
    - icon: fontawesome/brands/github
      link: https://github.com/FreeXYZ-HalfPI/Hannover-Handbook-InternationalStudents
      name: GitHub repository

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

validation:
  links:
    absolute_links: info
    unrecognized_links: warn
